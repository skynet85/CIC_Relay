objects:
- name: executionContext
  kind: struct
  description: executionContext holds the state for a single workflow execution. It
    contains the data variables and the materialized (live) modules.
  implements: []
  references: []
- name: cabinetService
  kind: struct
  description: cabinetService is the concrete implementation of the Cabinet interface,
    managing schemas, modules, workflows, and their execution via a WASM runtime with
    optional audit recording.
  implements:
  - Cabinet
  references: []
- name: cicWasmHost
  kind: interface
  description: cicWasmHost defines the interface for interacting with a live WASM
    instance. This allows for mocking in unit tests.
  references: []
  methods:
  - Close
  - Get
  - Init
  - Notify
  - Process
- name: wasmManager
  kind: interface
  description: wasmManager defines the interface for a WASM lifecycle manager. This
    allows for mocking in unit tests.
  references: []
  methods:
  - Close
  - NewHostInstance
- name: Cabinet
  kind: interface
  description: Cabinet defines the central API for schema/module/workflow management.
  references: []
  methods:
  - Close
  - GetModule
  - GetSchema
  - GetWorkflow
  - PutModule
  - PutSchema
  - PutWorkflow
  - Setx
- name: CabinetOption
  kind: type
  description: CabinetOption is a functional option for configuring a cabinetService.
  references: []
- name: NewExecutionContext
  kind: func
  description: NewExecutionContext creates a new execution context and initializes
    it with the starting payload.
  references: []
  calls: []
- name: Get
  kind: method
  receiver: executionContext
  description: Get retrieves a value from the context's variable store.
  references: []
  calls: []
- name: Set
  kind: method
  receiver: executionContext
  description: Set stores a value in the context's variable store.
  references: []
  calls: []
- name: GetModule
  kind: method
  receiver: executionContext
  description: GetModule retrieves a materialized module from the context.
  references: []
  calls: []
- name: StoreModule
  kind: method
  receiver: executionContext
  description: StoreModule stores a newly materialized module in the context.
  references: []
  calls:
  - ModuleDescriptor.ID
- name: WithRecorder
  kind: func
  description: WithRecorder sets an optional ExecutionRecorder on the service. If
    nil, ProofTrace recording is skipped silently.
  references: []
  calls: []
- name: WithProtectedModules
  kind: func
  description: WithProtectedModules marks components that only an authenticated principal
    (WithPrincipal) may run. Setx checks every step of a workflow against this set
    before it executes anything, so a workflow that contains a protected step is refused
    with ErrUnauthorized no matter which entry path started it, and no earlier step
    has run.
  references: []
  calls: []
- name: WithEvidenceRequired
  kind: func
  description: 'WithEvidenceRequired makes persisted evidence mandatory: when the
    ProofTrace of an execution is not persisted, Setx returns ErrEvidenceRequired
    (the message carries the chain hash) instead of a success. Off by default: a recording
    outage is then reported in SetResponse.Proof only.'
  references: []
  calls: []
- name: WithTraceSigner
  kind: func
  description: WithTraceSigner signs the chain hash of every ProofTrace (completed
    and failed runs) with signer before it is recorded, so a verifier holding the
    relay's key can check where a trace came from. Nil disables signing.
  references: []
  calls: []
- name: WithObsSinks
  kind: func
  description: 'WithObsSinks wires observability sinks into the underlying WasmManager.
    Both arguments are nil-safe: passing nil disables the corresponding emissions.'
  references:
  - obs.LogSink
  - obs.MetricSink
  calls:
  - SetObsSinks
- name: NewCabinetService
  kind: func
  description: NewCabinetService creates a new Cabinet service with the given stores
    and WasmManager configuration.
  references: []
  calls:
  - Format
  - NewWasmManager
  - UTC
- name: Setx
  kind: method
  receiver: cabinetService
  description: Setx executes a workflow based on the function-oriented model, resolving
    components, validating input schemas, dispatching to native or WASM implementations,
    and recording ProofTrace steps with input/output hashing.
  references: []
  calls:
  - ID
  - NewExecutionContext
  - ParseExecutionGraph
  - PrincipalFrom
  - cabinetService.GetWorkflow
- name: runStep
  kind: method
  receiver: cabinetService
  description: runStep resolves, validates and runs one workflow step, stores its
    result in execCtx and returns its ProofTrace record. It sets *dispatched just
    before handing the step to a module, the point after which the step may have had
    side effects.
  references: []
  calls:
  - Call
  - Checksum
  - Close
  - Elem
  - Get
  - In
  - Init
  - Interface
  - IsNil
  - Kind
  - NewHostInstance
  - Notify
  - NumIn
  - NumOut
  - Out
  - Process
  - Type
  - Workflow.ID
  - cabinetService.GetModule
  - executionContext.Get
  - executionContext.Set
- name: finishTrace
  kind: method
  receiver: cabinetService
  description: 'finishTrace builds the v2 ProofTrace of a run (completed or failed),
    signs its chain hash when a TraceSigner is configured, and records it. A signing
    failure leaves Signature empty and is logged: the trace keeps its integrity, only
    the proof of origin is missing.'
  references:
  - logrus.WithFields
  - logrus.Fields
  calls:
  - ComputeChainHashV2
  - Format
  - Sign
  - UTC
  - Warn
  - logrus.WithFields
- name: failedRunError
  kind: method
  receiver: cabinetService
  description: failedRunError records the trace of a run that failed after a step
    had been dispatched (completed steps plus the failed one's name, status "failed")
    and returns cause wrapped in an ExecutionFailedError that carries that trace and
    its proof status.
  references: []
  calls: []
- name: recordProof
  kind: method
  receiver: cabinetService
  description: recordProof persists the trace through the configured recorder and
    reports the outcome.
  references:
  - logrus.WithField
  - logrus.WithFields
  - logrus.Fields
  calls:
  - Record
  - RecordCommit
  - Warn
  - logrus.WithField
  - logrus.WithFields
- name: Close
  kind: method
  receiver: cabinetService
  description: Close closes the underlying WASM runtime and frees all associated resources.
  references: []
  calls:
  - Close
- name: isWasmTimeout
  kind: func
  description: isWasmTimeout checks whether a WASM errorResult string signals a timeout.
    The cicwasm layer encodes timeouts as {"code":"TIMEOUT",...}.
  references: []
  calls: []
