    a complete, recordable single-step ProofTrace (anchored to sourceDigest, with
    the ChainHash and an injected timestamp) plus the Rust record_hash anchor. Build
    step with ProofTraceStepFromActuation. Hand the result to an ExecutionRecorder
    to persist it durably.'
  references: []
  calls:
