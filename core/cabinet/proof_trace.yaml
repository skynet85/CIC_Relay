- name: ProofTraceStep
  kind: struct
  description: ProofTraceStep records the cryptographic fingerprint of a single workflow
    step. ModuleChecksum is the content checksum of the module that ran the step (for
    a WASM module it covers the canonical WASM binary). Module alone is the "name@version"
    label, under which two different binaries can be registered; the checksum names
    the artifact. It is bound by the v2 chain hash and ignored by v1.
  implements: []
  references: []
- name: ProofTrace
  kind: struct
  description: 'ProofTrace is the immutable audit record of a completed workflow execution.
    Every field is deterministic and canonicalizable; no clock or RNG side-effects
    are introduced here — the Timestamp must be injected by the caller. SourceDigest
    anchors the chain to the source revision. It is injected by the caller (e.g. git
    HEAD commit hash or BuildID) and becomes the first input of ChainHash, making
    the hash-chain continuous from source to output. ChainVersion names the chain
    hash format (empty = v1). Status and FailedStep record the outcome: a failed run
    is recorded too, with the steps that completed. Signature, when present, is the
    relay''s signature over ChainHash (TraceSigner); it is not part of the hash, and
    it is what turns a well-formed trace into one whose origin can be checked.'
  implements: []
  references: []
- name: ActuationProof
  kind: struct
  description: 'ActuationProof is the durable, recordable proof of one http-executor
    actuation (feature-009): the Go-side single-step ProofTrace (with its ChainHash)
    plus the Rust-side tamper-evident record_hash anchor carried across the FFI seam.
    Handed to an ExecutionRecorder, it is persisted as a Vault-signed Git commit (WorkflowRecorder
    → GitStateRecorder), so an actuation becomes durable, cryptographically anchored
    provenance — not just an in-memory fact. Both chains travel together: the Go ProofTrace
    ChainHash and the Rust ChainedEntry record_hash.'
  implements: []
  references: []
- name: TraceSigner
  kind: interface
  description: 'TraceSigner signs the chain hash of a ProofTrace with the relay''s
