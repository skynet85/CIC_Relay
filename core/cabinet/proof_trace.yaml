  - canonicaljson.ToJSON
- name: ComputeChainHashV1
  kind: func
  description: 'ComputeChainHashV1 returns SHA-256 over the full execution identity:
    "CICCHAINv1" \x00 sourceDigest \x00 workflowID \x00 [per step: name \x00 module
    \x00 inputHash \x00 outputHash \x00] The "CICCHAINv1" domain prefix: - Distinguishes
    chain hashes from Merkle-root hashes or leaf hashes produced elsewhere in this
    system (domain separation). - Makes the format versioned: a future format change
    uses "CICCHAINv2" and the two are unambiguously different even with identical
    field contents. \x00 separators prevent hash collisions between adjacent variable-length
    fields. sourceDigest anchors the chain to the source revision; pass "" when not
    available. workflowID binds the hash to the exact workflow definition that was
    executed. InputHash and step Name are included so that two different workflows
    producing the same outputs cannot share the same ChainHash.'
  references: []
  calls: []
- name: ComputeChainHashV2
  kind: func
  description: 'ComputeChainHashV2 returns the v2 chain hash of t: SHA-256 over "CICCHAINv2"
    ‖ f(source_digest) ‖ f(workflow_id) ‖ f(status) ‖ f(failed_step) ‖ f(timestamp)
    ‖ f(len(steps)) ‖ per step: f(name) ‖ f(module) ‖ f(module_checksum) ‖ f(input_hash)
    ‖ f(output_hash) where f(x) is the 8-byte big-endian length of x followed by x.
    Length prefixes make the encoding unambiguous for any field content (v1''s NUL
    separators are ambiguous when a field itself contains a NUL byte). Compared with
    v1 it also binds the module checksum of every step, the timestamp and the outcome
    of the run. ChainHash, ChainVersion and Signature are not inputs.'
  references: []
  calls:
  - PutUint64
  - Sum
  - Write
- name: ComputeChainHash
  kind: func
  description: 'ComputeChainHash returns the chain hash of t in the format its ChainVersion
    names: v2 (ComputeChainHashV2) for "v2", v1 (ComputeChainHashV1) for "" and "v1".
    It returns "" for an unknown version, which never equals a declared hash, so a
    verifier rejects it.'
  references: []
  calls:
  - ComputeChainHashV1
  - ComputeChainHashV2
- name: ChainVersionV1
  kind: const
  description: 'ChainVersionV1 is the original format (ComputeChainHashV1): source,
    workflow and per-step name/module/input/output, NUL-separated. It binds neither
    the module binary, the timestamp nor the outcome of the run.'
  references: []
- name: ChainVersionV2
  kind: const
  description: 'ChainVersionV2 is ComputeChainHashV2: length-prefixed fields that
    also bind the module checksum of every step, the timestamp and the outcome (status,
    failed step).'
  references: []
