objects:
- name: lockBuildDir
  kind: func
  description: 'lockBuildDir locks dir for one workflow run and returns the unlock
    function. An empty dir (no build directory configured or requested) takes no lock:
    such a run fails at its first step.'
  references: []
  calls:
  - Lock
- name: buildDirLocks
  kind: var
  description: buildDirLocks holds one mutex per build directory. A pipeline or repo
    CI run deletes its build directory, clones into it and builds from it across several
    workflow steps; two runs on the same directory at once would delete each other's
    checkout, and an artifact could be built from one request's source while its provenance
    names another's. Runs on one directory are therefore serialized for the whole
    workflow.
  references: []
