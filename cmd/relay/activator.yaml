- name: CabinetActivator
  kind: struct
  description: 'CabinetActivator implements operator.ResourceActivator by bridging
    IaC resource declarations to Cabinet.Setx() workflow execution. WorkflowID convention:
    "<schemaRef.Name>@<schemaRef.Version>" This matches the schemaRef already validated
    by IaCValidator — if the schema exists, the same ID is used to look up the workflow
    and module.'
  implements: []
  references:
  - cabinet.Cabinet
  - logrus.Logger
- name: NewCabinetActivator
  kind: func
  description: NewCabinetActivator creates an activator backed by the given Cabinet.
  references:
  - cabinet.Cabinet
  - logrus.Logger
  calls: []
- name: Activate
  kind: method
  receiver: CabinetActivator
  description: 'Activate executes the workflow for a validated, desired-present IaC
    resource. It maps res.SchemaRef to WorkflowID, passes res.Spec directly as the
    payload, and runs it through API.Set, so the same request validation applies as
    on the HTTP path. The ProofTrace is anchored to the resource''s declared intent:
    SourceDigest is iac.SpecDigest(res.Spec), the canonical digest of the spec, so
    a trace names the exact declaration it executed.'
  references:
  - types.ResourceSpec
  - iac.SpecDigest
